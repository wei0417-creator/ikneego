<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iKneeGo 快穿教學</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .tutorial-box { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* 娃娃/人物底圖區 */
        .character-stage { height: 250px; position: relative; margin-bottom: 20px; background: #e9ecef; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 50px; }
        
        /* 穿戴零件樣式 */
        .part { position: absolute; padding: 8px 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .locked { background: #007bff; color: white; border: 2px solid #0056b3; }
        .pending { background: #fff; color: #007bff; border: 2px dashed #007bff; }
        .hidden { display: none; }

        .hint { color: #666; font-size: 14px; margin-bottom: 20px; }
        #congratulations { display: none; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="tutorial-box">
    <h2>iKneeGo 3分鐘快穿體驗</h2>
    <p class="hint">請依序點擊零件，幫您的虛擬夥伴穿上外骨骼：</p>

    <div class="character-stage">
        <span id="char-icon">🚶‍♂️</span>
        <div id="p1" class="part hidden" style="top: 80px; left: 180px;">✅ 腰部已鎖定</div>
        <div id="p2" class="part hidden" style="top: 130px; left: 180px;">✅ 大腿已固定</div>
        <div id="p3" class="part hidden" style="top: 180px; left: 180px;">✅ 小腿已固定</div>
    </div>

    <div id="controls">
        <button id="step1" class="part pending">1. 扣上腰帶</button>
        <button id="step2" class="part pending" disabled>2. 固定大腿</button>
        <button id="step3" class="part pending" disabled>3. 固定小腿</button>
    </div>

    <div id="congratulations">
        🎉 穿戴完成！已準備好進行「實證步態分析」。
        <br><br>
        <a href="index.html" style="color: #007bff; text-decoration: none;">點此開始行走測試 →</a>
    </div>
</div>

<script>
    let currentStep = 1;
    const char = document.getElementById('char-icon');

    function nextStep(step) {
        document.getElementById('p' + step).classList.remove('hidden');
        document.getElementById('p' + step).classList.add('locked');
        document.getElementById('step' + step).style.background = '#28a745';
        document.getElementById('step' + step).style.color = '#fff';
        document.getElementById('step' + step).innerText = '已完成';
        
        if(step < 3) {
            currentStep++;
            document.getElementById('step' + currentStep).disabled = false;
        } else {
            char.innerText = "🦾";
            document.getElementById('congratulations').style.display = 'block';
            document.getElementById('controls').style.display = 'none';
        }
    }

    document.getElementById('step1').onclick = () => nextStep(1);
    document.getElementById('step2').onclick = () => nextStep(2);
    document.getElementById('step3').onclick = () => nextStep(3);
</script>

</body>
</html>
